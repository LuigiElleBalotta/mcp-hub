name: Release Build

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      version: ${{ steps.classify.outputs.version }}
    steps:
      - name: Classify tag as release or beta
        id: classify
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            kind=beta
          elif [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            kind=release
          else
            kind=none
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: check-tag
    if: needs.check-tag.outputs.kind != 'none'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build CLI exe (mcp-hub serve/import/apply)
        run: pyinstaller --onefile --name mcp-hub src/mcp_hub/__main__.py

      - name: Build GUI exe (mcp-hub-gui)
        run: pyinstaller --onefile --windowed --name mcp-hub-gui src/mcp_hub/gui/app.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-tag.outputs.version }}
          name: ${{ needs.check-tag.outputs.version }}
          prerelease: ${{ needs.check-tag.outputs.kind == 'beta' }}
          files: |
            dist/mcp-hub.exe
            dist/mcp-hub-gui.exe
